[project]
name = "robustfake"
version = "0.1.0"
description = "RobustFake: transformation-robust detection of AI-generated images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.25,<2",
    "imagehash>=4.3,<5",
    "modelscope-hub>=0.2,<1",
    "open-clip-torch>=2.26,<4",
    "pillow>=10,<13",
    "pyarrow>=15,<26",
    "pyyaml>=6,<7",
    "remotezip>=0.12,<1",
    "requests>=2.31,<3",
    "scikit-learn>=1.3,<2",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "tqdm>=4.66,<5",
    "urllib3>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
provenance = [
    "c2pa-python>=0.32,<0.33",
    "pillow-heif>=0.18,<2",
]
cv = [
    "opencv-python-headless>=4.10,<5",
]

[project.scripts]
aigc-prepare = "aigc_recognizer.data.mixed:main"
aigc-train = "aigc_recognizer.train:main"
aigc-provenance = "aigc_recognizer.provenance:main"
aigc-watermark = "aigc_recognizer.watermark:main"
aigc-restore-degradation = "aigc_recognizer.degradation_restore:main"
aigc-perspective = "aigc_recognizer.perspective:main"
aigc-visualize-residuals = "aigc_recognizer.visualize_residuals:main"
aigc-visualize-rgba = "aigc_recognizer.visualize_rgba:main"
aigc-predict = "aigc_recognizer.predict:main"
aigc-cache-features = "aigc_recognizer.feature_cache:main"
aigc-cache-residuals = "aigc_recognizer.feature_cache:main_residual_statistics"
aigc-calibrate = "aigc_recognizer.calibration:main"
robustfake-download-model = "aigc_recognizer.hub:main"
robustfake-ablation-report = "aigc_recognizer.ablation_report:main"
robustfake-baseline-report = "aigc_recognizer.baseline_report:main"
robustfake-baseline-examples = "aigc_recognizer.baseline_examples:main"
aigc-prepare-official-eval = "aigc_recognizer.official_data:main"
aigc-evaluate-official = "aigc_recognizer.official_eval:main"
aigc-prepare-wildfake-eval = "aigc_recognizer.external_data:main_wildfake"
aigc-prepare-sid-eval = "aigc_recognizer.external_data:main_sid"
aigc-evaluate-wildfake = "aigc_recognizer.external_eval:main_wildfake"
aigc-evaluate-sid = "aigc_recognizer.external_eval:main_sid"
aigc-download-baselines = "aigc_recognizer.baseline_eval:main_download"
aigc-evaluate-baselines = "aigc_recognizer.baseline_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigc_recognizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
