[project]
name = "aigc-recognizer"
version = "0.1.0"
description = "A transformation-robust detector for AI-generated images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.25,<2",
    "imagehash>=4.3,<5",
    "open-clip-torch>=2.26,<4",
    "pillow>=10,<13",
    "pyarrow>=15,<26",
    "pyyaml>=6,<7",
    "scikit-learn>=1.3,<2",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
provenance = [
    "c2pa-python>=0.32,<0.33",
    "pillow-heif>=0.18,<2",
]
cv = [
    "opencv-python-headless>=4.10,<5",
]

[project.scripts]
aigc-prepare = "aigc_recognizer.data.prepare:main"
aigc-train = "aigc_recognizer.train:main"
aigc-provenance = "aigc_recognizer.provenance:main"
aigc-watermark = "aigc_recognizer.watermark:main"
aigc-perspective = "aigc_recognizer.perspective:main"
aigc-visualize-residuals = "aigc_recognizer.visualize_residuals:main"
aigc-visualize-rgba = "aigc_recognizer.visualize_rgba:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigc_recognizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
