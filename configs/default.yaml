project:
  seed: 2026
  run_name: clip_b16_multiview

data:
  repo_id: Shanmuk4622/ai-image-detection-dataset
  revision: 8f1f536676f96cbc58bffd520ed50d1e7b9e894a
  metadata_file: metadata/manifest.parquet
  source_config_file: metadata/config.json
  shard_cache_dir: data/cache/ai_image_detection_shards
  output_dir: data/processed/ai_image_detection_20k
  manifest_path: data/processed/ai_image_detection_20k/manifest.jsonl
  audit_path: data/processed/ai_image_detection_20k/audit.json
  state_path: data/processed/ai_image_detection_20k/preparation_state.json
  nuisance_report_path: data/processed/ai_image_detection_20k/nuisance_report.json
  hf_auth: required
  generators:
    - sd15
    - sdxl
    - flux_schnell
    - kandinsky22
    - pixart_sigma
    - wuerstchen
  expected_parent_count: 10000
  expected_pipeline_version: "1.2"
  expected_image_size: 512
  download_workers: 2
  checkpoint_every_shards: 10
  network_max_retries: 5
  network_retry_base_seconds: 5.0
  max_download_gb: 28.0
  max_shard_cache_gb: 3.0
  max_image_pixels: 50000000
  exact_deduplication: true
  perceptual_deduplication: true
  perceptual_hash_size: 16
  official_leakage_manifest: data/evaluation/wildfake_official/manifest.jsonl
  official_leakage_root: data/evaluation/wildfake_official
  leakage_phash_distance: 8
  leakage_dhash_distance: 8

standardization:
  enabled: true
  application_probability: 0.75
  resize_weight: 0.30
  codec_weight: 0.30
  resize_codec_weight: 0.40
  resize_scale_min: 0.75
  resize_scale_max: 1.0
  jpeg_weight: 0.80
  webp_weight: 0.20
  quality_min: 85
  quality_max: 100

nuisance_audit:
  enabled: true
  random_state: 2026
  feature_size: 128
  max_iter: 150
  learning_rate: 0.08
  max_leaf_nodes: 15
  min_samples_leaf: 20
  permutation_repeats: 5

views:
  input_size: 224
  local_scale_min: 0.50
  local_scale_max: 0.90
  padding_color: 127
  random_interpolation: true

augmentations:
  transformed_clean_probability: 0.25
  single_operation_probability: 0.50
  double_operation_probability: 0.25
  jpeg_quality_min: 30
  jpeg_quality_max: 95
  blur_sigma_min: 0.1
  blur_sigma_max: 2.0
  resize_scale_min: 0.25
  resize_scale_max: 1.0
  gaussian_noise_sigma_min: 0.0
  gaussian_noise_sigma_max: 0.10
  color_jitter_strength: 0.20
  center_crop_min_fraction: 0.70
  center_crop_max_fraction: 1.0
  double_jpeg_weight: 0.08
  webp_weight: 0.05
  enable_double_jpeg: true
  enable_webp: true

model:
  backbone_name: ViT-B-16
  pretrained: openai
  embedding_dim: 512
  head_dim: 256
  projection_dim: 128
  dropout: 0.20

loss:
  classification_weight: 1.0
  consistency_weight: 0.5
  contrastive_weight: 0.1
  contrastive_temperature: 0.10

training:
  epochs: 12
  batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_fraction: 0.10
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: false
  amp: true
  amp_dtype: fp16
  device: auto
  gradient_clip_norm: 1.0
  early_stopping_patience: 3
  threshold: 0.5
  resume_from: null
  pin_memory: true

output:
  root_dir: artifacts/runs
  save_last: true
  keep_best_only: false

official_evaluation:
  repo_id: hy2628982280/WildFake
  revision: master
  output_dir: data/evaluation/wildfake_official
  manifest_path: data/evaluation/wildfake_official/manifest.jsonl
  audit_path: data/evaluation/wildfake_official/audit.json
  metadata_dir: data/cache/wildfake_official_metadata
  checkpoint_path: artifacts/runs/clip_b16_multiview/best.pt
  results_path: artifacts/evaluations/wildfake_official/results.json
  predictions_path: artifacts/evaluations/wildfake_official/predictions.jsonl
  dalle_metadata_file: label_csv_files/dalle3.csv
  coco_metadata_file: label_csv_files/real_coco.csv
  dalle_archive_file: Images/Diffusion_based/DALLE.zip
  coco_archive_file: Images/Real/coco.zip
  dalle_archive_sha256: 5e4ebc56daa06ebeec99711b9cc204571558d3e17366f2df992a8cfd4f251d4c
  coco_archive_sha256: 0b4dda0968e5f0d3cb60434c24204fcdac1cc0b40018093f15307edd545905b3
  expected_real_count: 4998
  expected_fake_count: 8843
  max_download_gb: 4.0
  checkpoint_every: 100
  request_timeout_seconds: 60.0
  network_max_retries: 5
  network_retry_backoff: 1.0
  batch_size: 32
  num_workers: 8
  prefetch_factor: 2
  save_predictions: true
  scenarios:
    - clean
    - jpeg_90
    - jpeg_70
    - jpeg_50
    - jpeg_30
    - blur_0.5
    - blur_1.0
    - blur_2.0
    - resize_0.5
    - resize_0.25
    - noise_0.02
    - noise_0.05
    - noise_0.10
    - color_jitter_0.20
    - center_crop_0.80
