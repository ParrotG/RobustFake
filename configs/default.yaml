  cache_dir: data/cache/external_baselines
  results_dir: artifacts/evaluations/baselines
  score_cache_enabled: true
  score_cache_dir: data/processed/baseline_score_cache
  input_size: 224
  threshold: 0.5
  max_download_gb: 2.0
  download_retries: 4
  retry_backoff_seconds: 2.0
  cnndetection_checkpoint_path: null
