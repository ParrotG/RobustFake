project:
  seed: 2026
  run_name: clip_b16_multiview

data:
  repo_id: OwensLab/CommunityForensics-Small
  revision: 6c539a534c07917307c381f5af4053c6091b5278
  shard_cache_dir: data/cache/community_forensics_shards
  shard_indices: [68, 70, 77, 78, 83, 115, 116, 156, 157]
  max_shard_cache_gb: 12.0
  output_dir: data/processed/community_forensics_20k
  manifest_path: data/processed/community_forensics_20k/manifest.jsonl
  audit_path: data/processed/community_forensics_20k/audit.json
  hf_auth: auto
  max_scanned: 150000
  checkpoint_every_scanned: 1000
  network_max_retries: 5
  network_retry_base_seconds: 5.0
  max_download_gb: 22.0
  max_image_pixels: 50000000
  train_per_class: 8000
  val_per_class: 2000
  train_generator_percent: 80
  architecture_ratios:
    LatDiff: 0.60
    GAN: 0.15
    PixDiff: 0.10
    other: 0.15
  systematic_per_model_cap: 6
  non_systematic_per_model_cap: 2000
  max_real_source_fraction: 0.70
  exclude_nsfw: true
  excluded_generator_tokens:
    - dall-e
    - dalle
    - openai
  excluded_real_source_tokens:
    - coco
  exact_deduplication: true
  perceptual_deduplication: true
  perceptual_hash_size: 8

views:
  input_size: 224
  local_scale_min: 0.50
  local_scale_max: 0.90
  padding_color: 127
  random_interpolation: true

augmentations:
  transformed_clean_probability: 0.25
  single_operation_probability: 0.50
  double_operation_probability: 0.25
  jpeg_quality_min: 30
  jpeg_quality_max: 95
  blur_sigma_min: 0.1
  blur_sigma_max: 2.0
  resize_scale_min: 0.25
  resize_scale_max: 1.0
  gaussian_noise_sigma_min: 0.0
  gaussian_noise_sigma_max: 0.10
  color_jitter_strength: 0.20
  center_crop_min_fraction: 0.70
  center_crop_max_fraction: 1.0
  double_jpeg_weight: 0.08
  webp_weight: 0.05
  enable_double_jpeg: true
  enable_webp: true

model:
  backbone_name: ViT-B-16
  pretrained: openai
  embedding_dim: 512
  head_dim: 256
  projection_dim: 128
  dropout: 0.20
  residual_enabled: true
  residual_channels: 16
  residual_embedding_dim: 64
  residual_head_dim: 64

loss:
  classification_weight: 1.0
  consistency_weight: 0.5
  contrastive_weight: 0.1
  contrastive_temperature: 0.10

training:
  epochs: 12
  batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_fraction: 0.10
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: false
  amp: true
  amp_dtype: fp16
  device: auto
  gradient_clip_norm: 1.0
  early_stopping_patience: 3
  threshold: 0.5
  resume_from: null
  pin_memory: true

output:
  root_dir: artifacts/runs
  save_last: true
  keep_best_only: false

provenance:
  max_files: 10000
  c2pa_tool_path: null
  c2pa_tool_timeout_seconds: 30.0
  c2pa_remote_manifest_fetch: false
  c2pa_ocsp_fetch: false
  c2pa_verify_trust: true

perspective:
  max_dimension: 1600
  canny_low_threshold: 50
  canny_high_threshold: 150
  hough_threshold: 50
  hough_min_line_length_ratio: 0.12
  hough_max_line_gap: 20
  min_long_line_length_ratio: 0.15
  similar_length_tolerance: 0.25
  angle_deduplication_degrees: 8.0
  max_lines: 24
  intersection_cluster_ratio: 0.035
  min_intersection_angle_degrees: 8.0
  min_vanishing_point_support: 2
  max_vanishing_distance_ratio: 4.0
  strict_color_length_selection: true
  strict_color_distance: 25.0
  strict_length_tolerance: 0.35
  strict_max_length_cv: 0.20
  strict_anchor_x_ratio: 0.18
  strict_anchor_y_ratio: 0.62
  strict_angle_band_degrees: 35.0
  parallel_angle_tolerance_degrees: 10.0
  fisheye_min_contour_length_ratio: 0.20
  fisheye_min_contour_elongation: 3.0
  fisheye_min_span_ratio: 0.30
  fisheye_max_curved_contour_count: 16
  fisheye_min_support: 2
  fisheye_min_angle_change_degrees: 18.0
  fisheye_min_chord_excess: 0.035
  fisheye_min_line_residual_ratio: 0.025
  fisheye_score_threshold: 0.50
  fisheye_curvature_threshold: 0.045
