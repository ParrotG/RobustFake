  expected_image_size: 512
  download_workers: 2
  checkpoint_every_shards: 10
  network_max_retries: 5
  network_retry_base_seconds: 5.0
  max_download_gb: 28.0
  max_shard_cache_gb: 3.0
  max_image_pixels: 50000000
  exact_deduplication: true
  perceptual_deduplication: true
  perceptual_hash_size: 16
  official_leakage_manifest: data/evaluation/wildfake_official/manifest.jsonl
  official_leakage_root: data/evaluation/wildfake_official
  leakage_phash_distance: 8
  leakage_dhash_distance: 8

mixed_data:
  enabled: true
  output_dir: data/processed/mixed_aigc_80k
  manifest_path: data/processed/mixed_aigc_80k/manifest.jsonl
  audit_path: data/processed/mixed_aigc_80k/audit.json
  state_path: data/processed/mixed_aigc_80k/selection_state.json
  dedup_report_path: data/processed/mixed_aigc_80k/dedup_report.json
  distribution_report_path: data/processed/mixed_aigc_80k/distribution_report.json
  cache_dir: data/cache/mixed_aigc_80k
  shanmuk_root: data/processed/ai_image_detection_20k
  community_root: data/processed/community_forensics_20k
  shanmuk_repo_id: Shanmuk4622/ai-image-detection-dataset
  shanmuk_revision: 8f1f536676f96cbc58bffd520ed50d1e7b9e894a
  community_repo_id: OwensLab/CommunityForensics-Small
  community_revision: 6c539a534c07917307c381f5af4053c6091b5278
  tiny_genimage_repo_id: TheKernel01/Tiny-GenImage
  tiny_genimage_revision: 89c4fe9efd0ebc7ce5c7641ef57d578ccd639c69
  wildfake_repo_id: hy2628982280/WildFake
  wildfake_revision: 18f53ff36ad9da60644039f0452b0e7b3907af6f
  wildfake_train_metadata_file: split_train_test/csv_file/total_split/train_metadata.csv
  wildfake_train_metadata_sha256: 26c6eacf6a34b7c61e7a1a3230c97624f58f857553cb525fe7f95dfbd5858be5
  target_total: 80000
  target_real: 40000
  target_fake: 40000
  reserve_multiplier: 1.25
  max_network_gb: 80.0
  storage_warning_min_gb: 25.0
  storage_warning_max_gb: 45.0
  download_workers: 4
  hash_workers: 4
  hash_checkpoint_every: 5000
  checkpoint_every: 100
  network_max_retries: 5
  network_retry_base_seconds: 2.0
  request_timeout_seconds: 60.0
  max_image_pixels: 50000000
  phash_size: 16
  phash_distance: 8
  dhash_distance: 8
  crop_phash_distance: 8
  source_quotas:
    shanmuk:
      train: {"0": 4000, "1": 4000}
      val_id: {"0": 1000, "1": 1000}
      val_dg: {"0": 0, "1": 0}
    wildfake:
      train: {"0": 9000, "1": 9000}
      val_id: {"0": 0, "1": 0}
      val_dg: {"0": 4000, "1": 2000}
    community_forensics:
      train: {"0": 13000, "1": 13000}
      val_id: {"0": 1000, "1": 2000}
      val_dg: {"0": 0, "1": 1000}
    tiny_genimage:
      train: {"0": 6000, "1": 6000}
      val_id: {"0": 2000, "1": 1000}
      val_dg: {"0": 0, "1": 1000}
  external_deny_manifests:
    - data/evaluation/wildfake_official/manifest.jsonl
    - data/evaluation/wildfake_broad_6k/manifest.jsonl
    - data/evaluation/sid_set_4k/manifest.jsonl
  wildfake_train_real_sources: [laion5b, imagenet, ffhq, celebahq]
  wildfake_dg_real_sources: [afhq, church]
  wildfake_dg_fake_architectures: [DDPM, GALIP, MAGE]
  global_heldout_generator_aliases: [ddpm, galip, mage, wukong]
  community_subset_weights: {Systematic: 0.50, Manual: 0.40, Commercial: 0.10}
  community_architecture_weights: {LatDiff: 0.50, GAN: 0.20, PixDiff: 0.15, other: 0.15}
  community_systematic_model_cap: 8
  community_other_model_cap: 200
  tiny_expected_rows: 35000
  tiny_expected_license: cc-by-nc-sa-4.0
  tiny_generators: [ADM, BigGAN, GLIDE, Midjourney, SD14, SD15, VQDM, Wukong]
  tiny_allowed_empty_generators: [SD14]

standardization:
  enabled: true
  application_probability: 0.75
  resize_weight: 0.30
  codec_weight: 0.30
  resize_codec_weight: 0.40
  resize_scale_min: 0.75
  resize_scale_max: 1.0
  jpeg_weight: 0.80
  webp_weight: 0.20
  quality_min: 85
  quality_max: 100

nuisance_audit:
  enabled: true
  random_state: 2026
  feature_size: 128
  max_iter: 150
  learning_rate: 0.08
  max_leaf_nodes: 15
  min_samples_leaf: 20
  permutation_repeats: 5
  max_train_samples: 12000
  max_evaluation_samples: 4000
  feature_workers: 4

views:
  input_size: 224
  global_crop_scale_min: 0.90
  global_crop_scale_max: 1.0
  local_scale_min: 0.50
  local_scale_max: 0.90
  padding_color: 127
  random_interpolation: true

augmentations:
  transformed_clean_probability: 0.25
  single_operation_probability: 0.50
  double_operation_probability: 0.25
  jpeg_quality_min: 30
  jpeg_quality_max: 95
  blur_sigma_min: 0.1
  blur_sigma_max: 2.0
  resize_scale_min: 0.25
  resize_scale_max: 1.0
  gaussian_noise_sigma_min: 0.0
  gaussian_noise_sigma_max: 0.10
  color_jitter_strength: 0.20
  center_crop_min_fraction: 0.70
  center_crop_max_fraction: 1.0
  double_jpeg_weight: 0.08
  webp_weight: 0.05
  enable_double_jpeg: true
  enable_webp: true

model:
  backbone_name: ViT-B-16-quickgelu
  pretrained: openai
  embedding_dim: 512
  intermediate_layers: [3, 6, 9, 11]
  multilayer_fusion_enabled: true
  intermediate_dim: 768
  head_dim: 256
  projection_dim: 128
  dropout: 0.10
  residual_statistics_enabled: true
  residual_statistics_dim: 24
  residual_hidden_dim: 64

loss:
  classification_weight: 1.0
  consistency_weight: 0.5
  consistency_rampup_epochs: 1
  contrastive_weight: 0.05
  contrastive_temperature: 0.10

training:
  epochs: 8
  batch_size: 64
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.001
  warmup_fraction: 0.05
  num_workers: 12
  prefetch_factor: 1
  persistent_workers: false
  amp: true
  amp_dtype: fp16
  device: auto
  gradient_clip_norm: 1.0
  early_stopping_patience: 3
  threshold: 0.5
  resume_from: null
  pin_memory: true

output:
  root_dir: artifacts/runs
  save_last: true
  keep_best_only: false

feature_cache:
  root_dir: data/processed/feature_cache
  use_for_training: false
  train_variants: 2
  shard_size: 2048
  batch_size: 64
  num_workers: 12
  prefetch_factor: 1
  pin_memory: true
  dtype: float16

official_evaluation:
  repo_id: hy2628982280/WildFake
  revision: master
  output_dir: data/evaluation/wildfake_official
  manifest_path: data/evaluation/wildfake_official/manifest.jsonl
  audit_path: data/evaluation/wildfake_official/audit.json
  metadata_dir: data/cache/wildfake_official_metadata
  results_path: artifacts/evaluations/wildfake_official/results.json
  predictions_path: artifacts/evaluations/wildfake_official/predictions.jsonl
  dalle_metadata_file: label_csv_files/dalle3.csv
  coco_metadata_file: label_csv_files/real_coco.csv
  dalle_archive_file: Images/Diffusion_based/DALLE.zip
  coco_archive_file: Images/Real/coco.zip
  dalle_archive_sha256: 5e4ebc56daa06ebeec99711b9cc204571558d3e17366f2df992a8cfd4f251d4c
  coco_archive_sha256: 0b4dda0968e5f0d3cb60434c24204fcdac1cc0b40018093f15307edd545905b3
  expected_real_count: 4998
  expected_fake_count: 8843
  max_download_gb: 4.0
  checkpoint_every: 100
  request_timeout_seconds: 60.0
  network_max_retries: 5
  network_retry_backoff: 1.0
evaluation:
  checkpoint_path: artifacts/models/robustfake/best.pt
  batch_size: 32
  num_workers: 8
  prefetch_factor: 2
  save_predictions: true
  calibration_enabled: true
  calibration_path: null
  calibration_threshold_strategy: constrained_minimax
  calibration_max_clean_ba_drop: 0.005
  hf_model_repo_id: ParrotG/RobustFake
  hf_model_revision: main
  hf_checkpoint_filename: best.pt
  hf_calibration_filename: calibration.json
  external_feature_cache_enabled: true
  external_feature_cache_dir: data/processed/external_feature_cache
  external_feature_cache_dtype: float16
  fast_max_samples: 2000
  fast_scenarios:
    - clean
    - jpeg_30
    - blur_2.0
    - resize_0.25
    - noise_0.10
    - color_jitter_0.20
    - center_crop_0.80
    - combo_stress_crop_0.80_blur_1.0_resize_0.25_jpeg_30
  enable_composed_scenarios: true
  scenarios:
    - clean
    - jpeg_90
    - jpeg_70
    - jpeg_50
    - jpeg_30
    - blur_0.5
    - blur_1.0
    - blur_2.0
    - resize_0.5
    - resize_0.25
    - noise_0.02
    - noise_0.05
    - noise_0.10
    - color_jitter_0.20
    - center_crop_0.80
  composed_scenarios:
    - combo_social_resize_0.5_jpeg_70
    - combo_repost_jpeg_90_resize_0.5_jpeg_70
    - combo_crop_0.80_resize_0.5_jpeg_70
    - combo_blur_1.0_resize_0.5_jpeg_50
    - combo_edit_color_0.20_noise_0.02_jpeg_70
    - combo_stress_crop_0.80_blur_1.0_resize_0.25_jpeg_30

