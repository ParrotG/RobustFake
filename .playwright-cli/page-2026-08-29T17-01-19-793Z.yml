                  - generic [ref=e788]: "5.1"
                  - generic [ref=e789]: Background
                - generic [ref=e792]: Generative AI tools are making it easier than ever to create highly realistic synthetic images at scale. This creates new risks for online platforms, including misinformation, impersonation, fraud, and reduced trust in digital content. In practice, detection becomes even harder after images are compressed, cropped, reposted, or lightly edited, so robust methods matter more than lab-only accuracy.
                - generic [ref=e799]:
                  - generic [ref=e800]: "5.2"
                  - generic [ref=e801]: Problem Statement
                - generic [ref=e804]: We want participants to build a prototype that can distinguish AI-generated images from authentic images with strong robustness under realistic post-processing and redistribution scenarios. The goal is not only to achieve good detection performance on clean data, but also to maintain accuracy after transformations such as blur, compression, color adjustment, cropping, or rescaling. Solutions should present a clear technical approach, an evaluation strategy, and thoughtful discussion of trade-offs such as robustness, generalisation, and false positives.
                - generic [ref=e809]: "Note: We consider robustness against a subset of the following augmentataions."
